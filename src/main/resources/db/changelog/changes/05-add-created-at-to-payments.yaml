databaseChangeLog:
  - changeSet:
      id: 05-add-created-at-to-payments
      author: humaNukr
      changes:
        - addColumn:
            tableName: payments
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false